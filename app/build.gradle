plugins {
    id 'com.android.application'
}

android {
    namespace 'com.subvoryn.voryn'
    compileSdk 35

    defaultConfig {
        applicationId 'com.subvoryn.voryn'
        minSdk 24
        targetSdk 29
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        versionCode 8
        versionName '0.5.0-beta1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // On-device English OCR. Preserve the existing extraction engine.
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'

    // Maintained FFmpegKit continuation; LGPL full includes libass/subtitles and MediaCodec.
    // This variant does not bundle GPL-only libx264; runtime probes the actual encoders.
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.9'

    // Pure-Java OCR cleanup regression tests.
    testImplementation 'junit:junit:4.13.2'
}
